# A — KOOL POOLS (мужчина со шлангом), 1 машущая рука (ладонь ВНУТРЬ)
target_height_mm: 2700
front_smooth_mm: 140
expected_arms: 1

seam_allowance_mm: 10           # отступ на пошив 10 мм на всех деталях
line_width_mm: 0.2
thickness_mm: 300
notch_interval_mm: 200
mirror_back: false
contour_gap_close_mm: 10.0
# контур переда/зада: включать ВСЕ детали фигуры (классификация по ближайшему телу,
# без строгого contains) — иначе мелкие оторванные заливки (локоть, брызги) выпадают из контура
front_all_details: true
fan_diameter_mm: 460
main_width_mm: 350
# сужение боковины 460->350 делать в ПЕРВОЙ части (seg0), а не во второй
edge_taper_single: true
transition_piece_len_mm: 500
protrusion_narrow: true
protrusion_open_r_mm: 60
protrusion_reach_ratio: 0.6
protrusion_min_area_mm2: 150
tip_width_mm: 250
protrusion_min_piece_mm: 500
neck_search_top_frac: 0.5
neck_smooth_mm: 40
neck_min_drop: 0.12
arm_side: auto
arm_hole_diameter_mm: 250
arm_hole_top_margin_mm: 20
base_diameter_mm: 460
leg_height_mm: 150
side_max_len_mm: 1500
side_min_len_mm: 200
corner_angle_deg: 35
corner_simplify_mm: 4.0
bottom_detect_frac: 0.03
figure_side: left
smooth_tol_mm: 1.0

# --- рез руки от подмышки (новый путь) ---
arm_cut: "armpit"
make_appendages: false
make_hand: false
make_spare_arm: true            # дополнительная (запасная) рука — копия ниже всего
arm_from_contour: false
make_base: true
make_back: true
repack: true                    # все детали разложены рядом без наложений
roll_pack: false
roll_width_mm: 1440

# фон
bg_page_frac: 0.95
bg_soft_frac: 0.80

# пороги детекта/реза подмышки
armpit_min_depth_frac: 0.06
armpit_min_arm_frac: 0.03
arm_max_frac: 0.35
arm_min_aspect: 2.5
blade_min_frac: 0.08
max_arms: 2
armpit_center_frac: 0.15
armpit_tip_free_frac: 0.20
armpit_up_slack_frac: 0.0
armpit_close_px: 9

# подмышка: опускать f в НИЖНЮЮ вогнутость основания руки (вся рука целиком)
armpit_pair_local_frac: 0.9      # радиус поиска нижней подмышки = доля длины вылета руки
armpit_refine_aspect_relax: 0.7  # послабление min_aspect при проверке опущенной подмышки
arm_template: true

# цвет боковин: пропускать и малонасыщенные реальные цвета (корпус бассейна — бежевый камень
# s≈0.19), чтобы низ красился как остальные части. Чисто-белое (рубашка s≈0)/серое всё равно уходит в белый.
accent_sat_min: 0.15
# скопления мелких цветных зон (< доли длины полосы) схлопывать в один доминирующий цвет
band_merge_small_frac: 0.12
# --- оптимизация памяти (OOM-фикс) ---
free_poly_cache: true
union_batch_size: 300
raster_zoom: 1.5
arm_raster_z: 3.0
