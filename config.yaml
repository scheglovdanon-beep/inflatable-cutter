# Параметры раскроя (не хардкодить в коде)
target_height_mm: 2700        # целевая высота фигуры
seam_allowance_mm: 10         # припуск на шов
thickness_mm: 300             # толщина фигуры = ширина боковой полоски без припусков
fabric_roll_width_mm: null    # ширина рулона; null = пока НЕ выкладываем на печать
notch_interval_mm: 200        # шаг насечек
mirror_back: true             # задняя панель — зеркальная копия передней

contour_gap_close_mm: 10.0     # закрытие щелей контура в ФИНАЛЬНЫХ мм (после масштаба к 2700)

# боковые части (гассет) — толщина по частям от вентилятора
fan_diameter_mm: 460           # первая часть у вентилятора (с обоих концов) = 460
main_width_mm: 350             # основной боковой размер (корпус+голова), для 2700 мм
transition_piece_len_mm: 500   # высота 2-й нижней детали (переход 460->350), одинаково Л/П

# сужение на выступах (антенна и т.п.) — 350 -> tip к центру выпуклости, с обеих сторон
protrusion_narrow: true        # включить сужение на выступах
protrusion_open_r_mm: 60       # радиус opening (ловит выступы тоньше 120 мм, для 2700)
protrusion_reach_ratio: 0.6    # порог reach/R: >=0.6 выступ, ~0.41 угол панели
protrusion_min_area_mm2: 150   # отсев мусора
tip_width_mm: 250              # толщина на кончике/центре выступа (для 2700)
protrusion_min_piece_mm: 500   # мин. высота детали с талией (50 см); короче -> слить с соседями

# днище (основание) + ножка
base_diameter_mm: 460          # Ø круга-днища (по умолчанию = вентилятору)
leg_height_mm: 150             # высота ножки (прямоугольник), ширина = длина окружности круга
side_max_len_mm: 1500          # макс. длина одной полосы (длиннее — дорезаем)
side_min_len_mm: 200           # мин. длина полосы (короче — сливаем с соседней)
corner_angle_deg: 35           # порог «угла» для точки разреза
corner_simplify_mm: 4.0        # упрощение кривой перед поиском углов (устойчивость)
bottom_detect_frac: 0.03       # нижняя полоса для поиска двух нижних углов (доля высоты)

# служебное (под конкретный вход)
figure_side: left             # (этап 1) какую фигуру считать передом
smooth_tol_mm: 1.0            # (этап 1) допуск сглаживания контура
